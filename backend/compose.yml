services:
  meadow-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MEADOW_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      MEADOW_DATA_FILE: /data/jobs.json
      MEADOW_API_TOKEN: "${MEADOW_API_TOKEN:-}"
    volumes:
      - meadow-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  meadow-data:
